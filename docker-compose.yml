services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coop
      POSTGRES_PASSWORD: coop
      POSTGRES_DB: canary
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coop -d canary"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - canary-pg:/var/lib/postgresql/data

volumes:
  canary-pg:
