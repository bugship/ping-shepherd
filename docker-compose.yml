services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shepherd
      POSTGRES_PASSWORD: shepherd
      POSTGRES_DB: ping_shepherd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shepherd -d ping_shepherd"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - ping-shepherd-pg:/var/lib/postgresql/data

volumes:
  ping-shepherd-pg:
