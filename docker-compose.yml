services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shepherd
      POSTGRES_PASSWORD: shepherd
      POSTGRES_DB: ping_shepherd
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shepherd -d ping_shepherd"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - ping-shepherd-pg:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://shepherd:shepherd@db:5432/ping_shepherd?sslmode=disable
      CHECK_INTERVAL: 30s
      CHECK_TIMEOUT: 5s
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  ping-shepherd-pg:
